<h1>술을 줄이자</h1>

<section><p>어제 기억은 잘 안 나는데, 술 마시고 여기저기 전화한 듯.
&hellip;젠장&hellip;
살아 있어서 죄송합니다. 하는 느낌.

요즘 여러모로 정신줄을 놓고 사는 것 같다.
반성. 반성.</p>
