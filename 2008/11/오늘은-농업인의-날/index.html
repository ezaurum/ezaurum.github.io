<h1>오늘은 농업인의 날</h1>
2008-11-11
<section><p>&hellip;이라지만 뭐 어차피 농업인의 날에 관심이 있었던 건 아니고.</p>

<p>교생실습 중이라 여고생에게 빼빼로를 받았&hellip; 지만 달랑 하나.
쉽게 얘기하면 딱 하나. 포장된 한 개를 의미하는 것이 아님.</p>

<p>그러고 보니 같이 실습나간 아이(女)가 학생한테 받았다고 주긴 했군.</p>
</section>
