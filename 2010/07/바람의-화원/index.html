<h1>바람의 화원</h1>
2010-07-05
<section><p>자대 와서 대기기간에 읽었었음.</p>

<p>문근영이 이뻐서 본 드라마의 원작이라 봄. 그럭저럭 괜찮은 정도? 소재도 신선하고 전체적인 구성도 짜임새 있어 좋았다.</p>

<p>드라마와는 대동소이 하지만 역시 비쥬얼이 없으니 좀 보기 팍팍하다는 정도.</p>

<p>하지만 그림을 좀 더 자세히 볼 수 있 화면보다 이 쪽이 낫더라.</p>

<p><sup>16</sup>&frasl;<sub>150</sub></p>
</section>
