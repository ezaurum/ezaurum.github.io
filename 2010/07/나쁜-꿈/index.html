<h1>나쁜 꿈</h1>
2010-07-05
<section><p>주말에 꿈을 꿨다.
아마도 쓸데없이 싸이질을 한 반동인 듯.
나한테 웃어줄 리가 없는 사람이 웃고 있는 걸 보니 참 기분 찝찝하더라.
결국 다시 싸이질을 하고, 불유쾌한 소식을 듣고.
잠도 설쳐보고.
결론은 여기가 군대라서 그렇다고 내렸다.
월말에 휴가 가서 학교나 들러봐야겠다.</p>
</section>
