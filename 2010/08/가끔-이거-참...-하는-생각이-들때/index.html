<h1>가끔 이거 참... 하는 생각이 들때</h1>
2010-08-23
<section><p>나랑 같은 옷을 입은 조인성 상병을 봤을 때.
이제 계급도 같은데 ORL&hellip; 역시 패션의 완성은 얼굴&hellip;</p>

<p>성당에서 신부님이 이렇게 말씀하실 때.
“오늘 성당에 새로 온 <strong>용사</strong>분 계십니까.”
마왕 두서넛 정도는 때려잡을 수 있을 것 같아&hellip;</p>

<p>세 줄 짜리 계급장을 보면서 뿌뜻해할 때.
&hellip;아놔&hellip; 군인이야&hellip;</p>
</section>
