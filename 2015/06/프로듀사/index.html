<h1>프로듀사</h1>
2015-06-21
<section><p>아주 오랜만에 진지하게 챙겨본 한국드라마.
아이유가 아니면 망했을 물건이다.
정말. 진지하게.
스토리를 너무 만만하게 썼어. 게다가 내부자이야기니까 결국 다들 착한 사람이다 라는 분위기로 가니까 악역도 없고 긴장감도 없고&hellip;
그냥 아이유가 이뻐서 봤다.
&hellip;뭐 그것만 해도 충분할 정도였지만.</p>
</section>
