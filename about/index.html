<h1>About</h1>
2007-08-17
<section><p>이 블로그는 나 자신을 위주로 한 세계에 대한 摹寫를 목표로 하고 있습니다.
프로그래머라고도 글쟁이라고도 부르기도 부족하지만 그런 것들을 목표로 하고 있는 사람입니다.
20세기와 21세기의 경계선쯤에 태어난 것은 행운이라고 생각하지만, 종종 십년정도 일찍 태어났어도 좋지 않았을까 생각합니다.</p>
</section>
