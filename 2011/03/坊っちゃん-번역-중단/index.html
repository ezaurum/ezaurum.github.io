<h1>坊っちゃん 번역 중단</h1>
2011-03-08
<section><p>하다보니 재미가 없기도 하고, 다른 공부할 것도 많다.
처음엔 그냥 두면 되겠다고 생각했으나, 그냥 이렇게 둔 게 한둘이 아니라 확실하게 맺어두는 것이 좋다고 판단했다.
