<h1>양자 컴퓨터</h1>
2011-08-16
<section><p>어렵다.
꽤 어렵다.
그래도 읽고 나니 어슴푸레하게나마 어떻게 양자 컴퓨터가 구현되는구나 하는 걸 알게 되어서 좋음.
설명이 꽤 자세하게 되어 있다.
시간이 나면 다시 한 번 읽어봐야지.
암호이론이라든가 컴퓨터의 기초적 구조에 대해서도 살짝 설명되어 있다.</p>
</section>
