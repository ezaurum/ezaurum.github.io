<h2>ISBN: </h2>
2011-08-25
<section><p>잘 모르겠다.
번역을 전에 해 보려고 했는데 중간에 때려치기는 했지.
사람들 사이의 관계라든가 그런 걸 묘하게 잘 그려내긴 했음.
어찌 보면 별 거 아닌데도 오묘함.
이런 게 대가인가.</p>
</section>
