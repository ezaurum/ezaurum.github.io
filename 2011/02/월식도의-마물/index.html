<h2>ISBN: </h2>
2011-02-04
<section><p>다나카 요시키의 최근.. 작인지 아닌지는 모르겠지만, 여튼 최근에 읽은 물건.</p>
<p>지금까지처럼 모험활극이긴 한데 캐릭터들이 전체적으로 약한 느낌. 요즘의 너무 강렬한 캐릭터에 길들여져서 그런가.</p>
<p>이걸로 40권 돌파. 아직 1/3도 못 채웠군.</p>
