<h1>줄라이켄 사람들</h1>
2011-02-04
<section><p><a href="http://books.google.com/books?id=s_BrAAAACAAJ&amp;dq=%EC%A4%84%EB%9D%BC%EC%9D%B4%EC%BC%84+%EC%82%AC%EB%9E%8C%EB%93%A4&amp;hl=en&amp;ei=C4RLTa25C43Rce_kqKIM&amp;sa=X&amp;oi=book_result&amp;ct=result&amp;resnum=1&amp;ved=0CCYQ6AEwAA">줄라이켄 사람들</a>
뭐랄까 기승전결이 잘 와 닿지 않는 이야기인데도 슬슬슬 따라가다 보면 재미있다.
그냥 봄이나 가을쯤, 눈부시지도 않는 느즈막한 오후 햇살이 비치는 곳을 멍하니 쳐다보는 그런 이야기랄까.</p>
