<h1>한줄 정리</h1>
2012-07-01
<section><p><a href="http://api.jquery.com/prevAll/">jQuery.prevAll</a>은, 시작점부터 역순으로 리스트를 만든다.
<code>
<pre>
&lt;ul&gt;
&lt;li&gt;4&lt;/li&gt;
&lt;li&gt;3&lt;/li&gt;
&lt;li&gt;2&lt;/li&gt;
&lt;li&gt;1&lt;/li&gt;
&lt;li id=&ldquo;target&rdquo;&gt;0&lt;/li&gt;
&lt;/ul&gt;
</pre>
</code>
이 경우, $(&ldquo;#target&rdquo;).prevAll(&ldquo;li&rdquo;)는 2, 3, 4가 된다. 당연한가? 쓰고 보니 한 줄도 아니군.</p>
</section>
