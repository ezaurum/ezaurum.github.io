<h1>운동일기</h1>
2012-07-17
<section><p>20분 정도 하고 옴. 졸리고 피곤해서 안되겠더라.
달리기 5백미터. 기타 운동깔짝. 체스트 프레스 현재 80kg. 이너타이는 발을 11자로 하고 해야 제대로 운동이 되더라.
일단 오늘은 75kg. 점심 굶어서 2주에 1키로 감량&hellip;</p>
</section>
