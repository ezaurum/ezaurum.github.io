<h1>아픈 와중에 생각 정리</h1>
2012-12-23
<section><p>일단 미래에 대한 전체적인 방향성은 정했다.</p>

<p>확실한 내 약점-대충대충-에 대한 것도 잘 알겠고-쉬이 고쳐지지도 않고 있지만- 내 강점-문자독해능-도 잘 알겠다. 여튼 그것보다는 망설이지 않아도 되는 주변 환경을 만들어야 할 텐데, 오늘도 그러지 못하게 하는 전화가&hellip; 일단 하나하나 해 보자.</p>

<p>그래. 일단은. 하나.</p>
</section>
