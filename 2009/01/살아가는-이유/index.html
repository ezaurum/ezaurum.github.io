<h1>살아가는 이유</h1>
2009-01-11
<section><p>재미있는 이야기가 끝도 없이 나오니까.
내일 일은 모레 걱정하고, 절망에게 농담을 건네자.
슬픈 이야기도 재미는 있기 마련이고,
눈물은 슬플 때만 나오는 건 아니니까.
그러니까. 고마워. 즐거워.</p>
</section>
